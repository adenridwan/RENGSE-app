name: rengse
description: RENGSÉ — catat tugasna, atur waktuna, réngsékeun sadayana.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo-rengse.png"
  adaptive_icon_background: "#6255E7"
  adaptive_icon_foreground: "assets/logo-rengse.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo-rengse.png
